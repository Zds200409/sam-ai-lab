<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>山姆 AI 会员助手</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:#f4f6f8; height:100vh; display:flex; flex-direction:column; }
        header { background:#1a1a2e; color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
        header h1 { margin:0; font-size:16px; font-weight:500; }
        header .meta { font-size:12px; color:#9aa; }
        header a { color:#8ab4f8; text-decoration:none; }
        #chat { flex:1; overflow-y:auto; padding:20px; }
        .msg { max-width:78%; padding:12px 16px; border-radius:12px; margin-bottom:14px; line-height:1.7; font-size:14px; white-space:pre-wrap; word-break:break-word; }
        .user { margin-left:auto; background:#409EFF; color:#fff; }
        .bot { background:#fff; color:#222; border:1px solid #e4e7ed; }
        .typing { color:#999; }
        footer { padding:14px 20px; background:#fff; border-top:1px solid #e4e7ed; display:flex; gap:10px; }
        textarea { flex:1; resize:none; height:46px; padding:12px; border:1px solid #dcdfe6; border-radius:8px; font-size:14px; font-family:inherit; outline:none; }
        textarea:focus { border-color:#409EFF; }
        button { padding:0 24px; border:none; border-radius:8px; background:#409EFF; color:#fff; font-size:14px; cursor:pointer; }
        button:disabled { background:#a0cfff; cursor:not-allowed; }
    </style>
</head>
<body>
<header>
    <h1>山姆 AI 会员助手</h1>
    <span class="meta">会话 <b id="cid"></b> · <a href="#" id="reset">重开</a></span>
</header>
<div id="chat"></div>
<footer>
    <textarea id="q" placeholder="问点什么，比如：我的会员等级能享受什么权益"></textarea>
    <button id="send">发送</button>
</footer>
<script>
    let cid = crypto.randomUUID();
    const $chat = document.getElementById('chat');
    const $q = document.getElementById('q');
    const $send = document.getElementById('send');
    const $cid = document.getElementById('cid');
    $cid.textContent = cid.slice(0, 8);

    function add(cls, text) {
        const d = document.createElement('div');
        d.className = 'msg ' + cls;
        d.textContent = text;
        $chat.appendChild(d);
        $chat.scrollTop = $chat.scrollHeight;
        return d;
    }

    async function send() {
        const q = $q.value.trim();
        if (!q || $send.disabled) return;
        $q.value = '';
        $send.disabled = true;
        add('user', q);
        const bubble = add('bot typing', '思考中...');

        let full = '';
        try {
            const url = '/api/ai/chat/stream?question=' + encodeURIComponent(q) + '&conversationId=' + encodeURIComponent(cid);
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const reader = res.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buf = '';
            bubble.classList.remove('typing');

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                const lines = buf.split('\n');
                buf = lines.pop();
                for (const line of lines) {
                    if (!line.startsWith('data:')) continue;
                    full += line.slice(5);
                    bubble.textContent = full;
                    $chat.scrollTop = $chat.scrollHeight;
                }
            }
        } catch (e) {
            bubble.classList.remove('typing');
            bubble.textContent = '[连接失败] ' + e.message;
        } finally {
            $send.disabled = false;
            $q.focus();
        }
    }

    $send.onclick = send;
    $q.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    document.getElementById('reset').onclick = e => {
        e.preventDefault();
        cid = crypto.randomUUID();
        $cid.textContent = cid.slice(0, 8);
        $chat.innerHTML = '';
    };
</script>
</body>
</html>
