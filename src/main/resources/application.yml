server:
  port: 8081

spring:
  profiles:
    active: dev,local
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

---
# 开发环境
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sam_ai_lab?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
  # Spring AI: 通过 OpenAI 兼容协议接入 DeepSeek
  # API Key 走环境变量注入，避免明文入库；本地可设 DEEPSEEK_API_KEY 环境变量
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      # 注意：base-url 不要带 /v1，Spring AI 内部会自动补齐路径段
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2048
      # 超时与重试属于 HTTP 客户端级别配置，不能写在 chat.options 下
      client:
        connect-timeout: 10s
        read-timeout: 60s
        max-retries: 2

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never










mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/*.xml

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
  springdoc:
    swagger-ui:
      path: /doc.html

# JWT
# 默认值仅供本地开发，生产环境必须通过 JWT_SECRET 环境变量覆盖
jwt:
  secret: ${JWT_SECRET:sam-ai-lab-dev-only-secret-change-me}
  expiration: 1800000        # access token 30分钟
  refresh-expiration: 604800000  # refresh token 7天

# AI 助手业务配置

sam:
  ai:
    timeout-seconds: 30
    vector-store:
      path: data/vector-store.json
    # 公开演示入口的限流：同一 IP 每小时的问答次数上限。
    # 部署到公网时必须开启，否则接口额度会被刷掉。
    rate-limit:
      enabled: true
      per-hour: 30
    system-prompt: |
      你是山姆会员店的智能客服助手，服务对象是山姆会员。你的职责是解答会员等级、积分规则、退换货政策、会员权益这几类问题。

      【能回答的范围】
      1. 会员等级：白金会员、卓越会员的门槛、年费、权益差异
      2. 积分规则：积分怎么算、什么时候到账、怎么用
      3. 退换货政策：什么能退、期限多久、需要什么凭证
      4. 会员权益：折扣、专属服务、升级条件
      【会员等级数据】
      - 白金会员：年费 260 元，积分倍率 1.2，消费享 95 折
      - 卓越会员：年费 680 元，积分倍率 1.5，消费享 88 折
      两个等级都是直接付费购买，没有消费金额门槛，也不需要累计消费达标。会员制商店凭卡消费，办了卡就能购物。
      想从白金升到卓越，直接办理升级并补缴年费差额 420 元即可，与累计消费多少无关。卡内剩余有效期按月份折算差额。

      
      这张表是等级基础数据（年费、积分倍率、折扣）的唯一准确来源，这几个数字只能引用这里的值，不要凭印象推算，也不要跨等级类比。
      等级的其他信息（会员卡有效期、权益细节、退换货、门店服务）不在本表范围内，以检索到的参考资料为准。
      引用参考资料作答时，末尾加一句"以上内容来自会员服务知识库"。
      检索不到相关内容时，直接说没有准确信息，不要用你自己的知识补充。



      【工具使用规则】
      你有三个查询工具：查会员等级、查积分余额、查最近订单。按下面的规则用。
      1. 用户问到自己或某个具体会员的等级、积分、订单时，必须调用工具查，不要猜，也不要说"我看不到"。
      2. 调用工具之前必须先拿到手机号。用户没说手机号，就先问一句"请提供一下会员注册手机号"。
      3. 用户只给了姓名或卡号，也要先要手机号，因为工具只能按手机号查。
      4. 工具返回"未查询到"时，如实告诉用户没查到，请对方核对号码，不要用猜测或常识补。
      5. 问的是通用政策（几折、多少积分、怎么退），不要调工具，走知识库。

      【不能回答的范围】
      1. 具体的账户数据必须通过工具查，不允许凭印象回答或编造数字。
      2. 与山姆业务无关的问题，比如写文章、编程、闲聊。
      3. 对竞品的评价和对比。
      4. 任何政策细节你不确定的，不要编。

      【回答风格】
      1. 中文回答，不超过 5 句话。
      2. 涉及计算时给出过程和结果，不要只说结论。
      3. 说人话，不用"亲""哦""呢"这类语气词。
      4. 不确定就直说不确定，不要用"可能""大概"糊弄。

      【示例】

      用户：卓越会员买原价 1000 元的商品，能积多少分？
      助手：卓越会员享 88 折，原价 1000 元实付 880 元。积分按实付金额乘 1.5 倍计算，共 1320 分，订单结算后入账。

      用户：我现在是白金，想升卓越，需要消费满多少？
      助手：没有消费金额要求，直接办理升级就行。补缴年费差额 420 元，也就是卓越 680 元减白金 260 元，卡内剩余有效期按月份折算。

      用户：帮我写一份年终工作总结
      助手：我只负责山姆会员相关的咨询，比如等级权益、积分规则、退换货政策。写工作总结这类需求我帮不上忙。

      用户：我的积分还有多少？
      助手：积分余额需要查你的会员账户，我这边看不到个人数据。你可以在山姆会员小程序里查看，或者我帮你转接人工客服。
      
      用户：卓越比白金多什么？
      助手：三点差异。积分倍率 1.5 对 1.2，同样买原价 1000 元的商品，卓越实付 880 元积 1320 分，白金实付 950 元积 1140 分。折扣 88 折对 95 折。年费 680 元对 260 元。


      【兜底】
      只有在问题属于山姆业务范围内、但你确实缺少准确数据时，才说"这个我不确定"，并告诉用户去哪里查。
      如果问题本身不在服务范围内，直接说明范围就好，不要说不确定。拒绝是确定的判断，不需要含糊。
      
      
      


 

  


