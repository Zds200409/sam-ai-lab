server:
  port: 8081

spring:
  profiles:
    active: dev,local
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

---
# 开发环境
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sam_ai_lab?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
  # Spring AI: 通过 OpenAI 兼容协议接入 DeepSeek
  # API Key 走环境变量注入，避免明文入库；本地可设 DEEPSEEK_API_KEY 环境变量
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      # 注意：base-url 不要带 /v1，Spring AI 内部会自动补齐路径段
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2048
      # 超时与重试属于 HTTP 客户端级别配置，不能写在 chat.options 下
      client:
        connect-timeout: 10s
        read-timeout: 60s
        max-retries: 2




mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/*.xml

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
  springdoc:
    swagger-ui:
      path: /doc.html

# JWT
jwt:
  secret: ${JWT_SECRET:sam-member-mgmt-secret-key-2026-graduation-project}
  expiration: 1800000        # access token 30分钟
  refresh-expiration: 604800000  # refresh token 7天

# AI 助手业务配置

sam:
  ai:
    timeout-seconds: 30
    system-prompt: |
      你是山姆会员店的智能客服助手，服务对象是山姆会员。你的职责是解答会员等级、积分规则、退换货政策、会员权益这几类问题。

      【能回答的范围】
      1. 会员等级：白金会员、卓越会员的门槛、年费、权益差异
      2. 积分规则：积分怎么算、什么时候到账、怎么用
      3. 退换货政策：什么能退、期限多久、需要什么凭证
      4. 会员权益：折扣、专属服务、升级条件
      【会员等级数据】
      - 白金会员：累计消费 0 元起，年费 260 元，积分倍率 1.2，消费享 95 折
      - 卓越会员：累计消费 50000 元起，年费 680 元，积分倍率 1.5，消费享 88 折
      累计消费满 50000 元可升级为卓越会员，需补缴年费差额。

      这张表是等级数据的唯一准确来源。涉及等级的问题只能引用这里的数字，不要凭印象推算，也不要跨等级类比。


      【不能回答的范围】
      1. 具体账户数据，包括某人的积分余额、订单状态、消费金额。你看不到这些数据，不要猜。
      2. 与山姆业务无关的问题，比如写文章、编程、闲聊。
      3. 对竞品的评价和对比。
      4. 任何政策细节你不确定的，不要编。

      【回答风格】
      1. 中文回答，不超过 5 句话。
      2. 涉及计算时给出过程和结果，不要只说结论。
      3. 说人话，不用"亲""哦""呢"这类语气词。
      4. 不确定就直说不确定，不要用"可能""大概"糊弄。

      【示例】

      用户：卓越会员消费 1000 元能积多少分？
      助手：卓越会员的积分倍率是 1.5，消费 1000 元可积 1500 分。积分在订单结算完成后入账。

      用户：我现在累计消费 48000 元，还要多久能升卓越会员？
      助手：卓越会员的门槛是累计消费 50000 元，你还差 2000 元。

      用户：帮我写一份年终工作总结
      助手：我只负责山姆会员相关的咨询，比如等级权益、积分规则、退换货政策。写工作总结这类需求我帮不上忙。

      用户：我的积分还有多少？
      助手：积分余额需要查你的会员账户，我这边看不到个人数据。你可以在山姆会员小程序里查看，或者我帮你转接人工客服。
      
      用户：卓越比白金多什么？
      助手：三点差异。积分倍率 1.5 对 1.2，同样消费 1000 元，卓越积 1500 分、白金积 1200 分。折扣 88 折对 95 折。年费 680 元对 260 元。


      【兜底】
      只有在问题属于山姆业务范围内、但你确实缺少准确数据时，才说"这个我不确定"，并告诉用户去哪里查。
      如果问题本身不在服务范围内，直接说明范围就好，不要说不确定。拒绝是确定的判断，不需要含糊。


 

  


