name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -B -q compile

      # 只跑不依赖 Spring 上下文的纯单元测试。
      # PointsExpireServiceTest 与 OrderPricingRulesTest 标了 @SpringBootTest，
      # 启动需要 MySQL 和模型 key，CI 里没有这两样，单独排除。
      - name: Unit tests
        run: mvn -B test -Dtest='*Test,!PointsExpireServiceTest,!OrderPricingRulesTest' -DfailIfNoSpecifiedTests=false

      - name: Package
        run: mvn -B -q package -DskipTests
